name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          # 22.04 keeps the glibc baseline low so the AppImage/deb also run on older distros;
          # ubuntu-latest would build against a newer glibc and break compatibility.
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MD Viewer ${{ github.ref_name }}'
          args: ${{ matrix.args }}
          # draft so nothing goes live until reviewed and published by hand
          releaseDraft: true
          prerelease: false

  notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body > notes.md

          cat > downloads.md <<'EOF'
          ### Downloads

          | Platform | File |
          | --- | --- |
          | Windows | `*_x64-setup.exe` (installer) or `*_x64_en-US.msi` |
          | macOS (Apple Silicon) | `*_aarch64.dmg` |
          | macOS (Intel) | `*_x64.dmg` |
          | Linux | `*.AppImage`, `*.deb`, or `*.rpm` |
          EOF

          cat downloads.md notes.md > full-notes.md
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file full-notes.md
