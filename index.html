<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Viewer</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <header id="toolbar">
        <button id="open-folder-btn" class="tb-btn" data-i18n-title="toolbar.openFolder.title">
          <svg viewBox="0 0 16 16" class="icon"><path d="M1.5 3a.5.5 0 0 1 .5-.5h3.6l1.2 1.4H14a.5.5 0 0 1 .5.5v8.1a.5.5 0 0 1-.5.5H2a.5.5 0 0 1-.5-.5V3z" fill="currentColor"/></svg>
          <span data-i18n="toolbar.openFolder">Apri cartella</span>
        </button>
        <button id="open-file-btn" class="tb-btn" data-i18n-title="toolbar.openFile.title">
          <svg viewBox="0 0 16 16" class="icon"><path d="M4 1.5h5.5L12.5 4.5V14a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5v-12A.5.5 0 0 1 4 1.5z" fill="none" stroke="currentColor"/><path d="M9.3 1.6V4.5h2.9" fill="none" stroke="currentColor"/></svg>
          <span data-i18n="toolbar.openFile">Apri file</span>
        </button>
        <div id="breadcrumb"></div>
        <span id="dirty-indicator" hidden>●</span>
        <button id="edit-btn" class="tb-btn icon-only" data-i18n-title="toolbar.edit.title" disabled>
          <svg viewBox="0 0 16 16" class="icon"><path fill="currentColor" d="M11.3 1.3a1 1 0 0 1 1.4 0l2 2a1 1 0 0 1 0 1.4l-8 8-3.7 1 1-3.7 8-8z"/></svg>
        </button>
        <button id="settings-btn" class="tb-btn icon-only" data-i18n-title="toolbar.settings.title">
          <svg viewBox="0 0 16 16" class="icon"><path fill="currentColor" d="M6.4 1.5h3.2l.4 1.9c.4.15.8.35 1.15.6l1.85-.65 1.6 2.75-1.5 1.25c.05.4.05.8 0 1.2l1.5 1.25-1.6 2.75-1.85-.65c-.35.25-.75.45-1.15.6l-.4 1.9H6.4l-.4-1.9a4.7 4.7 0 0 1-1.15-.6l-1.85.65-1.6-2.75 1.5-1.25a4.6 4.6 0 0 1 0-1.2l-1.5-1.25 1.6-2.75 1.85.65c.35-.25.75-.45 1.15-.6l.4-1.9zM8 10.3a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6z"/></svg>
        </button>
      </header>

      <div id="body">
        <aside id="sidebar">
          <div id="sidebar-header"><span id="sidebar-title" data-i18n="sidebar.placeholder">PROGETTO</span></div>
          <div id="file-tree"></div>
        </aside>
        <div id="resizer"></div>
        <main id="content">
          <div id="empty-state">
            <svg viewBox="0 0 48 48" class="empty-icon"><path d="M8 10h32v28H8z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 18h20M14 24h20M14 30h12" stroke="currentColor" stroke-width="2"/></svg>
            <p class="empty-title" data-i18n="empty.title">Nessun file aperto</p>
            <p class="empty-subtitle" data-i18n="empty.subtitle">Apri una cartella per esplorare i file Markdown, oppure apri direttamente un file.</p>
            <div class="empty-actions">
              <button id="empty-open-folder-btn" class="tb-btn primary" data-i18n="toolbar.openFolder">Apri cartella</button>
              <button id="empty-open-file-btn" class="tb-btn" data-i18n="toolbar.openFile">Apri file</button>
            </div>
          </div>
          <article id="markdown-preview" class="markdown-body" hidden></article>
          <div id="edit-layout" hidden>
            <div id="editor-column">
              <div id="edit-toolbar">
                <button type="button" class="fmt-btn" data-format="bold" title="Grassetto (Ctrl+B)"><strong>B</strong></button>
                <button type="button" class="fmt-btn" data-format="italic" title="Corsivo (Ctrl+I)"><em>I</em></button>
                <button type="button" class="fmt-btn" data-format="strikethrough" title="Barrato"><s>S</s></button>
                <span class="fmt-sep"></span>
                <button type="button" class="fmt-btn" data-format="heading" title="Titolo">H1</button>
                <button type="button" class="fmt-btn" data-format="code" title="Codice inline">&lt;/&gt;</button>
                <button type="button" class="fmt-btn" data-format="codeBlock" title="Blocco di codice">{ }</button>
                <span class="fmt-sep"></span>
                <button type="button" class="fmt-btn" data-format="link" title="Link (Ctrl+K)">
                  <svg viewBox="0 0 16 16" class="icon"><path d="M6.5 9.5l3-3M6 10.5L4.2 12.3a2 2 0 1 1-2.8-2.8L3.2 7.7a2 2 0 0 1 2.8 0M10 5.5l1.8-1.8a2 2 0 1 1 2.8 2.8L12.8 8.3a2 2 0 0 1-2.8 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                </button>
                <button type="button" class="fmt-btn" data-format="image" title="Immagine">
                  <svg viewBox="0 0 16 16" class="icon"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor"/><circle cx="5.2" cy="6" r="1.1" fill="currentColor"/><path d="M2 12l3.5-4 2.5 3 2-2.5L14 12" fill="none" stroke="currentColor" stroke-linejoin="round"/></svg>
                </button>
                <span class="fmt-sep"></span>
                <button type="button" class="fmt-btn" data-format="bulletList" title="Elenco puntato">•</button>
                <button type="button" class="fmt-btn" data-format="numberedList" title="Elenco numerato">1.</button>
                <button type="button" class="fmt-btn" data-format="taskList" title="Elenco di attività">
                  <svg viewBox="0 0 16 16" class="icon"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor"/><path d="M4.5 8l2 2 5-5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <span class="fmt-sep"></span>
                <button type="button" class="fmt-btn" data-format="blockquote" title="Citazione">”</button>
                <button type="button" class="fmt-btn" data-format="table" title="Tabella">
                  <svg viewBox="0 0 16 16" class="icon"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor"/><path d="M1.5 6.5h13M1.5 10.5h13M6 2.5v11M10.5 2.5v11" stroke="currentColor" stroke-width="0.9"/></svg>
                </button>
                <button type="button" class="fmt-btn" data-format="hr" title="Linea orizzontale">―</button>
              </div>
              <div id="editor-pane"></div>
            </div>
            <div id="edit-resizer"></div>
            <article id="edit-preview" class="markdown-body"></article>
            <button id="edit-close-btn" class="icon-btn" data-i18n-title="toolbar.edit.exit.title" aria-label="Close">
              <svg viewBox="0 0 16 16" class="icon"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
            </button>
          </div>
        </main>
      </div>

      <footer id="statusbar">
        <span id="status-left"></span>
      </footer>

      <div id="settings-overlay" hidden>
        <div id="settings-panel" role="dialog" aria-modal="true">
          <div class="settings-header">
            <h2 data-i18n="settings.title">Impostazioni</h2>
            <button id="settings-close-btn" class="icon-btn" aria-label="Close">
              <svg viewBox="0 0 16 16" class="icon"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="settings-body">
            <label class="settings-row">
              <span data-i18n="settings.language">Lingua</span>
              <select id="setting-language">
                <option value="it">Italiano</option>
                <option value="en">English</option>
              </select>
            </label>
            <label class="settings-row">
              <span data-i18n="settings.theme">Tema</span>
              <select id="setting-theme">
                <option value="dark" data-i18n="settings.theme.dark">Scuro</option>
                <option value="light" data-i18n="settings.theme.light">Chiaro</option>
                <option value="system" data-i18n="settings.theme.system">Segui il sistema</option>
              </select>
            </label>
            <label class="settings-row">
              <span data-i18n="settings.fontSize">Dimensione testo anteprima</span>
              <select id="setting-font-size">
                <option value="small" data-i18n="settings.fontSize.small">Piccolo</option>
                <option value="medium" data-i18n="settings.fontSize.medium">Medio</option>
                <option value="large" data-i18n="settings.fontSize.large">Grande</option>
              </select>
            </label>
            <label class="settings-row settings-row-check">
              <span data-i18n="settings.lineNumbers">Numeri di riga nel codice</span>
              <input type="checkbox" id="setting-line-numbers" />
            </label>
            <label class="settings-row settings-row-check">
              <span data-i18n="settings.wordWrap">A capo automatico nel codice</span>
              <input type="checkbox" id="setting-word-wrap" />
            </label>
            <label class="settings-row settings-row-check">
              <span data-i18n="settings.autoReload">Aggiorna automaticamente se il file cambia</span>
              <input type="checkbox" id="setting-auto-reload" />
            </label>
            <label class="settings-row settings-row-check">
              <span data-i18n="settings.showHidden">Mostra cartelle nascoste (.git, node_modules, …)</span>
              <input type="checkbox" id="setting-show-hidden" />
            </label>
          </div>
          <div id="settings-version"></div>
        </div>
      </div>
    </div>
  </body>
</html>
